<!DOCTYPE html>
<html>
<head>
<title>Welcome ❤️</title>
<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    color: white;
    text-align: center;
}

h1 {
    margin-top: 40%;
    font-size: 30px;
}

/* Hearts */
.heart {
    position: fixed;
    bottom: -10px;
    font-size: 20px;
    animation: floatUp 5s linear infinite;
}

@keyframes floatUp {
    0% {transform: translateY(0);}
    100% {transform: translateY(-100vh);}
}
</style>
</head>

<body>

<h1>Welcome Himanshu ❤️</h1>

<script>
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";

    heart.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}, 300);
</script>

</body>
</html>
