<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Login ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="login">

<div class="bg"></div>

<div class="login-box">
    <h2>🔐 Secret Love Login ❤️</h2>
    <p class="subtitle">Only for Special Person 💖</p>

    <input type="text" id="user" placeholder="👤 Username">
    <input type="password" id="pass" placeholder="🔑 Password">

    <button onclick="login()">Enter 💎</button>

    <p id="msg"></p>
</div>

<script src="script.js"></script>
</body>
</html>
